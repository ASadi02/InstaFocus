name: Build Instagram Focus APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/instafocus/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Instagram"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.instafocus.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.instafocus.app"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "1.1"
              }

              buildTypes {
                  debug {
                      isMinifyEnabled = false
                  }
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.activity:activity-ktx:1.9.3")
              implementation("androidx.webkit:webkit:1.12.1")
          }
          EOF

          cat << 'EOF' > app/proguard-rules.pro
          # ProGuard rules
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:type="radial"
                          android:centerX="28"
                          android:centerY="102"
                          android:gradientRadius="122">
                          <item android:offset="0.0" android:color="#FFFDF497" />
                          <item android:offset="0.16" android:color="#FFFDF497" />
                          <item android:offset="0.42" android:color="#FFFD5949" />
                          <item android:offset="0.68" android:color="#FFD6249F" />
                          <item android:offset="1.0" android:color="#FF285AEB" />
                      </gradient>
                  </aapt:attr>
              </path>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="5.2"
                  android:pathData="M42,28 L66,28 A14,14 0 0 1 80,42 L80,66 A14,14 0 0 1 66,80 L42,80 A14,14 0 0 1 28,66 L28,42 A14,14 0 0 1 42,28 Z" />
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="5.2"
                  android:pathData="M54,41.5 A12.5,12.5 0 1 0 54,66.5 A12.5,12.5 0 1 0 54,41.5 Z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M68.5,36.3 A3.2,3.2 0 1 0 68.5,42.7 A3.2,3.2 0 1 0 68.5,36.3 Z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.InstaFocus" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="Instagram"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.InstaFocus"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/instafocus/app/MainActivity.kt
          package com.instafocus.app

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.ViewConfiguration
          import android.view.View
          import android.view.ViewGroup
          import android.webkit.CookieManager
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.FrameLayout
          import android.widget.TextView
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.ViewCompat
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.webkit.WebViewCompat
          import androidx.webkit.WebViewFeature
          import kotlin.math.abs

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: ReelLockWebView
              private lateinit var reelLockScript: String
              private var injectReelLockAtDocumentStart = false
              private lateinit var timerBar: View
              private lateinit var timerBanner: TextView

              private var filePathCallback: ValueCallback<Array<Uri>>? = null

              private val timerHandler = Handler(Looper.getMainLooper())
              private var activeSeconds = 0
              private val reminderIntervalSeconds = 15 * 60

              private val timerRunnable = object : Runnable {
                  override fun run() {
                      activeSeconds++
                      updateTimerUi()
                      timerHandler.postDelayed(this, 1000L)
                  }
              }

              private val fileChooserLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  val callback = filePathCallback ?: return@registerForActivityResult
                  var results: Array<Uri>? = null

                  if (result.resultCode == Activity.RESULT_OK && result.data != null) {
                      val data = result.data!!
                      val clipData = data.clipData
                      if (clipData != null && clipData.itemCount > 0) {
                          results = Array(clipData.itemCount) { i -> clipData.getItemAt(i).uri }
                      } else if (data.data != null) {
                          results = arrayOf(data.data!!)
                      }
                  }

                  callback.onReceiveValue(results)
                  filePathCallback = null
              }

              companion object {
                  private const val HOME_URL = "https://www.instagram.com/?variant=following"
                  private val INSTAGRAM_ORIGINS = setOf(
                      "https://instagram.com", "https://www.instagram.com", "https://m.instagram.com"
                  )
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  WindowCompat.setDecorFitsSystemWindows(window, false)

                  val rootContainer = FrameLayout(this).apply {
                      setBackgroundColor(Color.BLACK)
                      layoutParams = ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  }

                  ViewCompat.setOnApplyWindowInsetsListener(rootContainer) { view, windowInsets ->
                      val insets = windowInsets.getInsets(
                          WindowInsetsCompat.Type.systemBars() or WindowInsetsCompat.Type.ime()
                      )
                      view.setPadding(insets.left, insets.top, insets.right, insets.bottom)
                      WindowInsetsCompat.CONSUMED
                  }

                  webView = ReelLockWebView(this).apply {
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                      setBackgroundColor(Color.BLACK)
                  }

                  val barHeightPx = (2 * resources.displayMetrics.density).toInt().coerceAtLeast(2)
                  timerBar = View(this).apply {
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          barHeightPx,
                          Gravity.TOP
                      )
                      setBackgroundColor(Color.parseColor("#4CAF50"))
                      pivotX = 0f
                      scaleX = 0f
                  }

                  val padH = (16 * resources.displayMetrics.density).toInt()
                  val padV = (8 * resources.displayMetrics.density).toInt()
                  val topMargin = (14 * resources.displayMetrics.density).toInt()
                  timerBanner = TextView(this).apply {
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      ).apply {
                          setMargins(0, topMargin, 0, 0)
                      }
                      setPadding(padH, padV, padH, padV)
                      setTextColor(Color.WHITE)
                      textSize = 13f
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#CC1E1E1E"))
                          cornerRadius = 40f
                          setStroke(2, Color.parseColor("#FF9800"))
                      }
                      visibility = View.GONE
                  }

                  configureSecurityAndSession()
                  installReelLock()
                  configureClients()

                  rootContainer.addView(webView)
                  rootContainer.addView(timerBar)
                  rootContainer.addView(timerBanner)
                  setContentView(rootContainer)

                  setupBackNavigation()

                  if (savedInstanceState == null) {
                      webView.loadUrl(HOME_URL)
                  } else {
                      webView.restoreState(savedInstanceState)
                  }
              }

              private fun updateTimerUi() {
                  val progress = (activeSeconds % reminderIntervalSeconds).toFloat() / reminderIntervalSeconds.toFloat()
                  timerBar.scaleX = if (activeSeconds >= reminderIntervalSeconds && activeSeconds % reminderIntervalSeconds == 0) {
                      1f
                  } else {
                      progress
                  }

                  when {
                      activeSeconds >= reminderIntervalSeconds -> timerBar.setBackgroundColor(Color.parseColor("#FF5252"))
                      progress > 0.7f -> timerBar.setBackgroundColor(Color.parseColor("#FF9800"))
                      else -> timerBar.setBackgroundColor(Color.parseColor("#4CAF50"))
                  }

                  if (activeSeconds > 0 && activeSeconds % reminderIntervalSeconds == 0) {
                      val mins = activeSeconds / 60
                      timerBanner.text = "$mins dakika oldu"
                      timerBanner.alpha = 0f
                      timerBanner.visibility = View.VISIBLE
                      timerBanner.animate().alpha(1f).setDuration(300).start()
                      timerHandler.postDelayed({
                          timerBanner.animate().alpha(0f).setDuration(400).withEndAction {
                              timerBanner.visibility = View.GONE
                          }.start()
                      }, 4000L)
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun configureSecurityAndSession() {
                  val cookieManager = CookieManager.getInstance()
                  cookieManager.setAcceptCookie(true)
                  cookieManager.setAcceptThirdPartyCookies(webView, true)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true

                      allowFileAccess = false
                      allowContentAccess = false
                      mixedContentMode = WebSettings.MIXED_CONTENT_NEVER_ALLOW

                      userAgentString = userAgentString.replace("; wv", "")

                      useWideViewPort = true
                      loadWithOverviewMode = true
                      setSupportZoom(false)
                      mediaPlaybackRequiresUserGesture = false
                      cacheMode = WebSettings.LOAD_DEFAULT
                  }
              }

              private fun installReelLock() {
                  reelLockScript = assets.open("reel-lock.js").bufferedReader().use { it.readText() }
                  if (WebViewFeature.isFeatureSupported(WebViewFeature.WEB_MESSAGE_LISTENER)) {
                      WebViewCompat.addWebMessageListener(
                          webView, "InstaFocusReelLock", INSTAGRAM_ORIGINS
                      ) { _, message, origin, isMainFrame, _ ->
                          if (isMainFrame && origin.toString() in INSTAGRAM_ORIGINS) {
                              when (message.data) {
                                  "lock" -> webView.gestureLocked = true
                                  "unlock" -> webView.gestureLocked = false
                              }
                          }
                      }
                  }
                  injectReelLockAtDocumentStart =
                      WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT)
                  if (injectReelLockAtDocumentStart) {
                      WebViewCompat.addDocumentStartJavaScript(webView, reelLockScript, INSTAGRAM_ORIGINS)
                  }
              }

              private fun configureClients() {
                  webView.webViewClient = object : WebViewClient() {

                      override fun shouldOverrideUrlLoading(
                          view: WebView?,
                          request: WebResourceRequest?
                      ): Boolean {
                          val uri = request?.url ?: return false
                          val host = uri.host?.lowercase() ?: return false
                          val path = uri.path ?: ""

                          if (uri.scheme == "intent" || uri.scheme == "instagram") {
                              return true
                          }

                          val isInstagramDomain = (host == "instagram.com" || host.endsWith(".instagram.com"))
                          if (uri.scheme == "https" && isInstagramDomain) {
                              if (path == "/reels" || path == "/reels/") {
                                  view?.loadUrl(HOME_URL)
                                  return true
                              }
                              return false
                          }

                          try {
                              startActivity(Intent(Intent.ACTION_VIEW, uri))
                          } catch (_: Exception) {
                          }
                          return true
                      }

                      override fun onPageStarted(view: WebView?, url: String?, favicon: Bitmap?) {
                          super.onPageStarted(view, url, favicon)
                          webView.gestureLocked = false
                          injectFocusScript(view)
                      }

                      override fun onPageFinished(view: WebView?, url: String?) {
                          super.onPageFinished(view, url)
                          if (!injectReelLockAtDocumentStart) {
                              view?.evaluateJavascript(reelLockScript, null)
                          }
                          view?.evaluateJavascript("window.__instafocusReelSync?.(true);", null)
                          injectFocusScript(view)
                      }

                      override fun doUpdateVisitedHistory(view: WebView?, url: String?, isReload: Boolean) {
                          super.doUpdateVisitedHistory(view, url, isReload)
                          injectFocusScript(view)
                          view?.evaluateJavascript(
                              "window.__instafocusReelSync?.(); window.__instafocusSync?.();", null
                          )
                      }
                  }

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          webView: WebView?,
                          filePathCallback: ValueCallback<Array<Uri>>?,
                          fileChooserParams: FileChooserParams?
                      ): Boolean {
                          this@MainActivity.filePathCallback?.onReceiveValue(null)
                          this@MainActivity.filePathCallback = filePathCallback

                          val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "*/*"
                              putExtra(Intent.EXTRA_MIME_TYPES, arrayOf("image/*", "video/*"))
                              putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                          }

                          return try {
                              fileChooserLauncher.launch(Intent.createChooser(intent, "Medya Seç"))
                              true
                          } catch (_: Exception) {
                              this@MainActivity.filePathCallback = null
                              false
                          }
                      }
                  }
              }

              private fun injectFocusScript(view: WebView?) {
                  view?.evaluateJavascript(FOCUS_INJECTION_JS, null)
              }

              private fun setupBackNavigation() {
                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (webView.canGoBack()) {
                              webView.goBack()
                          } else {
                              isEnabled = false
                              onBackPressedDispatcher.onBackPressed()
                          }
                      }
                  })
              }

              override fun onResume() {
                  super.onResume()
                  timerHandler.removeCallbacks(timerRunnable)
                  timerHandler.postDelayed(timerRunnable, 1000L)
              }

              override fun onPause() {
                  super.onPause()
                  timerHandler.removeCallbacks(timerRunnable)
                  CookieManager.getInstance().flush()
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState)
                  webView.saveState(outState)
              }

              override fun onDestroy() {
                  timerHandler.removeCallbacks(timerRunnable)
                  webView.stopLoading()
                  webView.destroy()
                  super.onDestroy()
              }
          }

          private class ReelLockWebView(context: Context) : WebView(context) {
              private val touchSlop = ViewConfiguration.get(context).scaledTouchSlop
              private var startX = 0f
              private var startY = 0f
              private var touchInProgress = false
              private var tapOnly = false
              private var cancelPending = false
              private var swallowing = false

              var gestureLocked = false
                  set(value) {
                      if (value && !field && touchInProgress && !tapOnly) cancelPending = true
                      field = value
                  }

              override fun dispatchTouchEvent(event: MotionEvent): Boolean {
                  val action = event.actionMasked
                  if (action == MotionEvent.ACTION_DOWN) {
                      startX = event.x
                      startY = event.y
                      touchInProgress = true
                      tapOnly = gestureLocked
                      cancelPending = false
                      swallowing = false
                      if (tapOnly) parent?.requestDisallowInterceptTouchEvent(true)
                      return super.dispatchTouchEvent(event)
                  }

                  val terminal = action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_CANCEL
                  if (terminal) touchInProgress = false

                  if (swallowing) return true
                  if (cancelPending || tapOnly && (
                          action == MotionEvent.ACTION_POINTER_DOWN ||
                          (action == MotionEvent.ACTION_MOVE || action == MotionEvent.ACTION_UP) &&
                          maxOf(abs(event.x - startX), abs(event.y - startY)) >= touchSlop
                      )
                  ) {
                      cancelPending = false
                      swallowing = true
                      val cancel = MotionEvent.obtain(event).apply { this.action = MotionEvent.ACTION_CANCEL }
                      try {
                          super.dispatchTouchEvent(cancel)
                      } finally {
                          cancel.recycle()
                      }
                      return true
                  }

                  // Deliver taps, but withhold even the first MOVE from the page.
                  if (tapOnly && action == MotionEvent.ACTION_MOVE) return true
                  return super.dispatchTouchEvent(event)
              }

              override fun onGenericMotionEvent(event: MotionEvent): Boolean {
                  if (gestureLocked && event.actionMasked == MotionEvent.ACTION_SCROLL) return true
                  return super.onGenericMotionEvent(event)
              }
          }

          private const val FOCUS_INJECTION_JS = """
          (function() {
            if (window.__instafocusInstalled) {
              if (window.__instafocusSync) window.__instafocusSync();
              return;
            }
            window.__instafocusInstalled = true;

            // 1. Kalici CSS kurallari
            const style = document.createElement('style');
            style.id = 'instafocus-css';
            style.textContent = `
              /* Reels sekmesi ikonunu ve linkini komple gizle */
              a[href="/reels/"],
              a[href="/reels"],
              a[href^="/reels/?"] {
                display: none !important;
                visibility: hidden !important;
                width: 0 !important;
                height: 0 !important;
                pointer-events: none !important;
              }

              /* Kesfet sayfasinda alttaki gonderi ve reels izgarasini gizle, arama cubugunu koru */
              html.instafocus-explore main a[href^="/p/"],
              html.instafocus-explore main a[href^="/reel/"],
              html.instafocus-explore main a[href^="/reels/"] {
                display: none !important;
              }

            `;
            (document.head || document.documentElement).appendChild(style);

            function isLoggedIn() {
              return !document.querySelector('input[name="username"]') &&
                     (!!document.querySelector('a[href*="/direct/"]') || !!document.querySelector('nav'));
            }

            function hideReelsNavWrappers() {
              document.querySelectorAll('a[href="/reels/"], a[href="/reels"]').forEach(a => {
                a.style.setProperty('display', 'none', 'important');
                const parent = a.parentElement;
                if (parent && parent.children.length === 1 && parent.tagName === 'DIV') {
                  parent.style.setProperty('display', 'none', 'important');
                }
              });
            }

            function cleanFeedAndBanners() {
              const path = location.pathname;

              const appKeywords = [
                'uygulamada aç', 'uygulamayı kullan', 'uygulamayı indir',
                'open in app', 'open app', 'use the app', 'get the instagram app'
              ];
              document.querySelectorAll('div, section, a, button').forEach(el => {
                if (el.dataset.ifChecked === '1') return;
                const txt = (el.innerText || '').trim().toLowerCase();
                if (!txt || txt.length > 90) return;
                if (appKeywords.some(k => txt === k || txt.includes(k))) {
                  const box = el.closest('div[role="dialog"]') || el.closest('div');
                  if (box && box.offsetHeight > 0 && box.offsetHeight < 180 && !box.querySelector('video')) {
                    box.style.setProperty('display', 'none', 'important');
                    el.dataset.ifChecked = '1';
                  }
                }
              });

              if (path === '/' || path === '') {
                const caughtUpWords = ['tüm yeni gönderileri gördün', "you're all caught up"];
                const suggestWords = [
                  'senin için önerilenler', 'önerilen gönderiler', 'önerilen reels',
                  'kimi takip etmeli', 'suggested for you', 'suggested posts', 'suggested reels'
                ];

                const main = document.querySelector('main');
                if (!main) return;

                main.querySelectorAll('article, section, div').forEach(node => {
                  if (node.dataset.ifHidden === '1') return;
                  const text = (node.innerText || '').toLowerCase();
                  if (!text || text.length > 350) return;

                  if (caughtUpWords.some(w => text.includes(w))) {
                    let container = node;
                    while (container.parentElement && container.parentElement !== main && container.parentElement.children.length < 3) {
                      container = container.parentElement;
                    }
                    let next = container.nextElementSibling;
                    while (next) {
                      next.style.setProperty('display', 'none', 'important');
                      next.dataset.ifHidden = '1';
                      next = next.nextElementSibling;
                    }
                  }

                  if (suggestWords.some(w => text.includes(w))) {
                    const card = node.closest('article') || node;
                    if (card && card !== main && card.offsetHeight < 950) {
                      card.style.setProperty('display', 'none', 'important');
                      card.dataset.ifHidden = '1';
                    }
                  }
                });
              }

              if (path.startsWith('/explore')) {
                document.querySelectorAll('main a[href^="/p/"], main a[href^="/reel/"]').forEach(a => {
                  const row = a.closest('div[style*="flex-direction"]') || a.parentElement;
                  if (row) row.style.setProperty('display', 'none', 'important');
                });
              }
            }

            window.__instafocusSync = function() {
              const path = location.pathname;

              if (path === '/reels' || path === '/reels/') {
                location.replace('https://www.instagram.com/?variant=following');
                return;
              }

              if (path === '/' && !location.search.includes('variant=following') && isLoggedIn()) {
                location.replace('https://www.instagram.com/?variant=following');
                return;
              }

              document.documentElement.classList.toggle('instafocus-explore', path.startsWith('/explore'));

              hideReelsNavWrappers();
              cleanFeedAndBanners();
            };

            for (const method of ['pushState', 'replaceState']) {
              const original = history[method];
              history[method] = function() {
                const result = original.apply(this, arguments);
                setTimeout(window.__instafocusSync, 30);
                return result;
              };
            }
            window.addEventListener('popstate', () => setTimeout(window.__instafocusSync, 30));

            const observer = new MutationObserver(() => {
              hideReelsNavWrappers();
              cleanFeedAndBanners();
            });

            function startObserver() {
              if (document.body) {
                observer.observe(document.body, { childList: true, subtree: true });
                window.__instafocusSync();
              } else {
                setTimeout(startObserver, 100);
              }
            }
            startObserver();
          })();
          """
          EOF

          cat << 'EOF' > app/src/main/assets/reel-lock.js
          (function () {
            const origins = ['https://instagram.com', 'https://www.instagram.com', 'https://m.instagram.com'];
            if (window !== window.top || !origins.includes(location.origin)) return;
            if (window.__instafocusReelSync) {
              window.__instafocusReelSync();
              return;
            }

            const reelId = path => /^\/reels?\/([^/]+)(?:\/|$)/.exec(path)?.[1];
            const isThread = path => /^\/direct\/t\/[^/]+/.test(path);
            const isPost = path => /^\/p\/[^/]+/.test(path);
            const dialogSelector = 'dialog[open], [role="dialog"], [aria-modal="true"]';
            const lockClass = 'instafocus-player-locked';
            const scrollerClass = 'instafocus-player-scroller';
            let lockedScrollers = new Set();
            let active = null;
            let lastPath = location.pathname;
            let postFromThread = false;
            let scheduled = false;
            let style;

            function playerBox(el, width, height) {
              if (!el.isConnected) return null;
              if (el.checkVisibility && !el.checkVisibility({
                checkOpacity: true, checkVisibilityCSS: true
              })) return null;
              const css = getComputedStyle(el);
              if (css.visibility !== 'visible' || css.opacity === '0') return null;
              const rect = el.getBoundingClientRect();
              const left = Math.max(0, rect.left);
              const right = Math.min(width, rect.right);
              const top = Math.max(0, rect.top);
              const bottom = Math.min(height, rect.bottom);
              if (right <= left || bottom <= top) return null;
              return { left, right, top, bottom, w: (right - left) / width, h: (bottom - top) / height };
            }

            function overlayRoot(video, width, height) {
              const dialog = video.closest(dialogSelector);
              if (dialog) return dialog;
              for (let node = video; node && node !== document.body; node = node.parentElement) {
                const position = getComputedStyle(node).position;
                if (position !== 'fixed' && position !== 'absolute') continue;
                const box = playerBox(node, width, height);
                if (box && box.w >= 0.92 && box.h >= 0.90) return node;
              }
              return null;
            }

            function isInFront(video, overlay, box) {
              const x = (box.left + box.right) / 2;
              return [0.27, 0.5, 0.73].some(fraction => {
                const top = document.elementFromPoint(x, box.top + (box.bottom - box.top) * fraction);
                if (!top) return false;
                if (overlay) return overlay.contains(top);
                if (top === video || top.contains(video)) return true;
                const stack = document.elementsFromPoint(x, box.top + (box.bottom - box.top) * fraction);
                // A control may sit above the media, inside its immediate player wrapper.
                return video.parentElement?.contains(top) && stack.includes(video);
              });
            }

            function findPlayer(path) {
              const id = reelId(path);
              if (!id && !isThread(path) && !isPost(path)) return null;
              const width = document.documentElement?.clientWidth || innerWidth;
              const height = document.documentElement?.clientHeight || innerHeight;
              for (const video of document.querySelectorAll('video')) {
                const box = playerBox(video, width, height);
                if (!box || box.top > height * 0.36 || box.bottom < height * 0.64) continue;
                const overlay = overlayRoot(video, width, height);
                if (id && isInFront(video, overlay, box)) return { id, video };
                const modalVideo = overlay && (box.w >= 0.48 && box.h >= 0.36 || box.w >= 0.25 && box.h >= 0.63);
                const largeVideo = (isThread(path) || postFromThread) && box.w >= 0.71 && box.h >= 0.62;
                if (!modalVideo && !largeVideo) continue;
                // Keep the same player locked when its own comments cover the video.
                if (active?.video === video || isInFront(video, overlay, box)) return { id, video };
              }
              return id ? { id } : null;
            }

            function updateScrollers(video) {
              const next = new Set();
              for (let node = video?.parentElement; node; node = node.parentElement) {
                const overflow = getComputedStyle(node).overflowY;
                if (node === document.scrollingElement || lockedScrollers.has(node) ||
                    overflow === 'auto' || overflow === 'scroll' || overflow === 'overlay') {
                  next.add(node);
                  if (!node.classList.contains(scrollerClass)) node.classList.add(scrollerClass);
                }
              }
              for (const node of lockedScrollers) {
                if (!next.has(node)) node.classList.remove(scrollerClass);
              }
              lockedScrollers = next;
            }

            function sync(forceMessage) {
              const path = location.pathname;
              if (lastPath !== path) {
                postFromThread = isThread(lastPath) && isPost(path);
                lastPath = path;
              }
              const wasLocked = Boolean(active);
              active = findPlayer(path);
              const locked = Boolean(active);
              const root = document.documentElement;
              if (root) {
                if (!style && locked) {
                  style = document.createElement('style');
                  style.textContent = 'html.' + lockClass + ', html.' + lockClass +
                    ' * { touch-action: none !important; overscroll-behavior: none !important; ' +
                    'scroll-snap-type: none !important; } html.' + lockClass +
                    ' .' + scrollerClass + ', html.' + lockClass + '.' + scrollerClass +
                    ' { overflow-y: hidden !important; }';
                  (document.head || root).appendChild(style);
                }
                root.classList.toggle(lockClass, locked);
              }
              updateScrollers(active?.video);
              if (locked !== wasLocked || forceMessage === true) {
                window.InstaFocusReelLock?.postMessage(locked ? 'lock' : 'unlock');
              }
            }
            window.__instafocusReelSync = sync;

            function scheduleSync() {
              if (scheduled) return;
              scheduled = true;
              requestAnimationFrame(() => {
                scheduled = false;
                sync();
              });
            }

            function stop(event) {
              if (event.cancelable) event.preventDefault();
              event.stopImmediatePropagation();
            }

            // Recheck synchronously at gesture start to cover newly opened overlays before
            // the next animation frame and before the native bridge message is delivered.
            for (const type of ['pointerdown', 'touchstart']) {
              window.addEventListener(type, sync, { capture: true, passive: true });
            }
            for (const type of ['pointermove', 'touchmove', 'wheel']) {
              window.addEventListener(type, event => {
                if (type === 'wheel' || !active) sync();
                if (active) stop(event);
              }, { capture: true, passive: false });
            }

            window.addEventListener('keydown', event => {
              if (['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End', ' '].includes(event.key)) {
                if (event.key === ' ' && event.target instanceof Element &&
                    event.target.closest('button, [role="button"], input, textarea, [contenteditable]')) return;
                sync();
                if (active) stop(event);
              }
            }, true);

            for (const method of ['pushState', 'replaceState']) {
              const original = history[method];
              history[method] = function (state, title, url) {
                if (active?.id && url != null) {
                  let next;
                  try { next = new URL(url, location.href); } catch (_) {}
                  if (next?.origin === location.origin) {
                    const id = reelId(next.pathname);
                    if (id && id !== active.id) return;
                  }
                }
                const result = original.apply(this, arguments);
                sync();
                return result;
              };
            }

            for (const type of ['popstate', 'pageshow', 'resize', 'fullscreenchange', 'loadedmetadata',
                                'transitionend', 'animationend']) {
              window.addEventListener(type, scheduleSync, true);
            }
            new MutationObserver(scheduleSync).observe(document, {
              childList: true,
              subtree: true,
              attributes: true,
              attributeFilter: ['class', 'style', 'hidden', 'open', 'role', 'aria-modal', 'src']
            });
            sync();
          })();
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Instagram-Focus-APK
          path: app/build/outputs/apk/debug/app-debug.apk
